<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Light Control</title>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#050b14;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* =========================
   STARTUP SCREEN
========================= */

#startup{

    position:fixed;
    inset:0;

    background:#02060b;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:9999;

    transition:opacity .25s ease;
}

#startup h1{

    margin:0 0 25px 0;

    letter-spacing:3px;

    color:white;

    text-shadow:
        0 0 10px #22c55e,
        0 0 20px #22c55e;
}


#startup p{

    color:#22c55e;

    font-weight:bold;

    letter-spacing:1px;
}


/* PCB */

.pcb{

    width:320px;
    height:220px;

    position:relative;

    border:2px solid #16a34a;

    border-radius:15px;

    background:
    linear-gradient(
        90deg,
        transparent 49%,
        #123b24 50%,
        transparent 51%
    ),

    linear-gradient(
        transparent 49%,
        #123b24 50%,
        transparent 51%
    );

    box-shadow:
        0 0 20px #16a34a,
        inset 0 0 30px #062b17;

    overflow:hidden;
}


.track{

    position:absolute;

    height:3px;

    background:#22c55e;

    box-shadow:0 0 8px #22c55e;
}


.t1{
    width:180px;
    top:50px;
    left:20px;
}

.t2{
    width:220px;
    top:110px;
    left:60px;
}

.t3{
    width:150px;
    top:165px;
    left:30px;
}


.current{

    position:absolute;

    width:12px;
    height:12px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 8px #22c55e,
        0 0 20px #22c55e;

    animation:flow 1.5s linear infinite;
}


.c1{
    top:44px;
    left:20px;
}

.c2{
    top:104px;
    left:60px;
    animation-delay:.5s;
}

.c3{
    top:159px;
    left:30px;
    animation-delay:1s;
}


@keyframes flow{

    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(200px);
    }
}


/* =========================
   CONTAINER
========================= */

.container{

    width:92%;

    max-width:450px;

    background:#111827;

    padding:30px;

    border-radius:20px;

    box-shadow:
        0 0 30px rgba(0,0,0,.5);

    text-align:center;
}


.hidden{
    display:none !important;
}


/* =========================
   INPUT
========================= */

input,
select{

    width:100%;

    padding:14px;

    margin:8px 0;

    border-radius:10px;

    border:1px solid #374151;

    background:#1f2937;

    color:white;

    font-size:16px;
}


input:focus,
select:focus{

    outline:none;

    border-color:#3b82f6;

}


/* =========================
   BUTTON
========================= */

button{

    width:100%;

    padding:14px;

    margin:8px 0;

    border:none;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


button:hover{
    opacity:.9;
}


.login{
    background:#2563eb;
    color:white;
}

.signup{
    background:#7c3aed;
    color:white;
}

.on{
    background:#16a34a;
    color:white;
}

.off{
    background:#dc2626;
    color:white;
}

.logout{
    background:#475569;
    color:white;
}

.adminBtn{
    background:#f59e0b;
    color:#111827;
}

.backBtn{
    background:#64748b;
    color:white;
}


/* =========================
   TEXT
========================= */

.link{

    color:#60a5fa;

    cursor:pointer;

    margin-top:15px;
}

.message{

    color:#f87171;

    min-height:20px;

    font-size:14px;
}


/* =========================
   LIGHT STATUS
========================= */

.status{

    font-size:26px;

    margin:20px 0;

    font-weight:bold;
}


/* =========================
   ADMIN
========================= */

.adminTitle{

    color:#fbbf24;

    margin-bottom:5px;
}


.userCard{

    background:#1f2937;

    border:1px solid #374151;

    border-radius:12px;

    padding:15px;

    margin:12px 0;

    text-align:left;
}


.userName{

    font-size:18px;

    font-weight:bold;
}


.userEmail{

    color:#9ca3af;

    font-size:13px;

    margin:5px 0 10px;
}


.badge{

    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-bottom:8px;
}


.badgeAdmin{
    background:#f59e0b;
    color:#111827;
}


.badgeUser{
    background:#2563eb;
    color:white;
}


.badgeDenied{
    background:#dc2626;
    color:white;
}


.badgeAllowed{
    background:#16a34a;
    color:white;
}


.adminActions{

    display:flex;

    gap:8px;

    margin-top:8px;
}


.adminActions button{

    margin:0;

    padding:10px;

    font-size:13px;
}


.allowBtn{
    background:#16a34a;
    color:white;
}


.denyBtn{
    background:#dc2626;
    color:white;
}


.roleBtn{
    background:#8b5cf6;
    color:white;
}


#usersList{

    max-height:430px;

    overflow-y:auto;

    margin-top:15px;
}


/* =========================
   LOADING
========================= */

.loading{

    color:#60a5fa;

    margin:15px;
}

</style>

</head>


<body>


<!-- =====================================================
     STARTUP
===================================================== -->

<div id="startup">

    <h1>💡 SMART LIGHT</h1>

    <div class="pcb">

        <div class="track t1"></div>

        <div class="track t2"></div>

        <div class="track t3"></div>

        <div class="current c1"></div>

        <div class="current c2"></div>

        <div class="current c3"></div>

    </div>

    <p>INITIALIZING SYSTEM...</p>

</div>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage" class="container hidden">

    <h1>🔐 Smart Light</h1>

    <p>Secure Access</p>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button
        class="login"
        id="loginBtn">
        LOGIN
    </button>

    <p
        class="link"
        id="showSignup">
        Create new account
    </p>

    <p
        class="message"
        id="loginMessage">
    </p>

</div>


<!-- =====================================================
     SIGN UP
===================================================== -->

<div id="signupPage" class="container hidden">

    <h1>📝 Create Account</h1>

    <input
        type="text"
        id="signupName"
        placeholder="Your Name"
    >

    <input
        type="email"
        id="signupEmail"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        autocomplete="new-password"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
    >

    <button
        class="signup"
        id="signupBtn">
        CREATE ACCOUNT
    </button>

    <p
        class="link"
        id="showLogin">
        Already have an account? Login
    </p>

    <p
        class="message"
        id="signupMessage">
    </p>

</div>


<!-- =====================================================
     USER CONTROL PAGE
===================================================== -->

<div id="controlPage" class="container hidden">

    <h1>💡 Smart Light</h1>

    <p id="welcome"></p>

    <div
        class="status"
        id="lightStatus">
        🔴 LIGHT OFF
    </div>

    <button
        class="on"
        id="onBtn">
        💡 TURN ON
    </button>

    <button
        class="off"
        id="offBtn">
        🔴 TURN OFF
    </button>

    <p>

        Last operation:

        <br>

        <b id="lastUser">---</b>

        <br>

        Time:

        <b id="lastTime">---</b>

    </p>


    <!-- ADMIN BUTTON -->

    <button
        class="adminBtn hidden"
        id="adminBtn">
        👑 ADMIN PROFILE
    </button>


    <button
        class="logout"
        id="logoutBtn">
        LOGOUT
    </button>

</div>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage" class="container hidden">

    <h1 class="adminTitle">👑 Admin Profile</h1>

    <p id="adminWelcome"></p>

    <hr>

    <h3>👥 User Management</h3>

    <p
        id="adminMessage"
        class="message">
    </p>

    <div
        id="usersList">

        <p class="loading">
            Loading users...
        </p>

    </div>


    <button
        class="backBtn"
        id="backToControl">
        ← BACK TO SMART LIGHT
    </button>


    <button
        class="logout"
        id="adminLogout">
        LOGOUT
    </button>

</div>


<!-- =====================================================
     STARTUP SCRIPT
     IMPORTANT:
     This is NOT inside Firebase.
===================================================== -->

<script>

/*
    STARTUP = 2 SECONDS

    Firebase cannot stop this timer.
*/

window.addEventListener("load", function(){

    const startup =
        document.getElementById("startup");

    setTimeout(function(){

        startup.style.opacity = "0";

        setTimeout(function(){

            startup.classList.add("hidden");

        },250);

    },1750);

});

</script>


<!-- =====================================================
     FIREBASE
===================================================== -->

/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =========================
   ELEMENTS
========================= */

const loginPage =
    document.getElementById("loginPage");

const signupPage =
    document.getElementById("signupPage");

const controlPage =
    document.getElementById("controlPage");

const adminPage =
    document.getElementById("adminPage");


/* =========================
   HIDE ALL PAGES
========================= */

function hideAllPages(){

    loginPage.classList.add("hidden");

    signupPage.classList.add("hidden");

    controlPage.classList.add("hidden");

    adminPage.classList.add("hidden");
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

    hideAllPages();

    loginPage.classList.remove("hidden");

}


/* =========================
   SHOW SIGNUP
========================= */

function showSignup(){

    hideAllPages();

    signupPage.classList.remove("hidden");

}


/* =========================
   SHOW CONTROL
========================= */

function showControl(){

    hideAllPages();

    controlPage.classList.remove("hidden");

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    hideAllPages();

    adminPage.classList.remove("hidden");

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginBtn")
.addEventListener("click", async function(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    const message =
        document.getElementById("loginMessage");


    message.textContent = "";


    if(!email || !password){

        message.textContent =
        "Please enter email and password.";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(error){

        console.error(error);

        if(error.code ===
            "auth/invalid-credential"){

            message.textContent =
            "Invalid email or password.";

        }
        else if(error.code ===
            "auth/user-not-found"){

            message.textContent =
            "Account not found.";

        }
        else if(error.code ===
            "auth/wrong-password"){

            message.textContent =
            "Wrong password.";

        }
        else{

            message.textContent =
            error.message;
        }

    }

});


/* =====================================================
   SIGNUP PAGE
===================================================== */

document
.getElementById("showSignup")
.addEventListener("click", function(){

    document
    .getElementById("loginMessage")
    .textContent = "";

    showSignup();

});


/* =====================================================
   LOGIN PAGE
===================================================== */

document
.getElementById("showLogin")
.addEventListener("click", function(){

    document
    .getElementById("signupMessage")
    .textContent = "";

    showLogin();

});


/* =====================================================
   CREATE ACCOUNT
===================================================== */

document
.getElementById("signupBtn")
.addEventListener("click", async function(){

    const name =
        document
        .getElementById("signupName")
        .value
        .trim();

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("signupPassword")
        .value;

    const confirm =
        document
        .getElementById("confirmPassword")
        .value;


    const message =
        document.getElementById("signupMessage");


    message.textContent = "";


    /* VALIDATION */

    if(!name){

        message.textContent =
        "Please enter your name.";

        return;
    }


    if(!email){

        message.textContent =
        "Please enter your email.";

        return;
    }


    if(password.length < 6){

        message.textContent =
        "Password must contain at least 6 characters.";

        return;
    }


    if(password !== confirm){

        message.textContent =
        "Passwords do not match.";

        return;
    }


    try{

        /*
            Create Firebase Authentication account
        */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        /*
            EVERY NEW ACCOUNT IS USER
            NOT ADMIN
        */

        await set(
            ref(
                db,
                "users/" + result.user.uid
            ),
            {

                name:name,

                email:email,

                role:"user",

                denied:false

            }
        );


        message.textContent =
        "Account created successfully.";

        /*
            onAuthStateChanged()
            will automatically open
            the Smart Light page.
        */

    }
    catch(error){

        console.error(error);

        if(error.code ===
            "auth/email-already-in-use"){

            message.textContent =
            "This email is already registered. Please LOGIN instead.";

        }
        else if(error.code ===
            "auth/invalid-email"){

            message.textContent =
            "Invalid email address.";

        }
        else if(error.code ===
            "auth/weak-password"){

            message.textContent =
            "Password is too weak.";

        }
        else{

            message.textContent =
            error.message;

        }

    }

});


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        /*
            Nobody logged in
        */

        if(!user){

            showLogin();

            return;
        }


        try{

            const userRef =
                ref(
                    db,
                    "users/" + user.uid
                );


            const snapshot =
                await get(userRef);


            /*
                Authentication account exists
                but database profile does not.
            */

            if(!snapshot.exists()){

                await signOut(auth);

                alert(
                    "User profile not found. Please contact administrator."
                );

                showLogin();

                return;
            }


            const data =
                snapshot.val();


            /*
                BLOCKED USER
            */

            if(data.denied === true){

                await signOut(auth);

                alert(
                    "Your access has been denied by the administrator."
                );

                showLogin();

                return;
            }


            /*
                USER IS OK
            */

            document
            .getElementById("welcome")
            .textContent =
            "Welcome, " +
            (data.name || "User");


            /*
                ADMIN
            */

            if(data.role === "admin"){

                document
                .getElementById("adminBtn")
                .classList.remove("hidden");

            }
            else{

                document
                .getElementById("adminBtn")
                .classList.add("hidden");

            }


            showControl();

        }
        catch(error){

            console.error(error);

            alert(
                "Unable to load user profile."
            );

            await signOut(auth);

        }

    }
);
