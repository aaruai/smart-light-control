<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Light Control</title>

<style>
/* =========================
   BASIC
========================= */
*{ box-sizing:border-box; }

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background: linear-gradient(135deg, #061326, #073b4c, #071d4d);
    color:white;
}

/* =========================
   CONTAINER
========================= */
.container{
    width:92%;
    max-width:430px;
    padding:30px;
    background: rgba(8,35,48,0.96);
    border-radius:22px;
    box-shadow: 0 15px 50px rgba(0,0,0,.55);
    text-align:center;
}

.hidden{ display:none !important; }

/* =========================
   HEADINGS
========================= */
h1{ margin:0 0 8px; font-size:30px; }
.subtitle{ color:#b7dce5; margin-bottom:25px; }

/* =========================
   INPUT
========================= */
input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #607d8b;
    background:#263b46;
    color:white;
    font-size:16px;
    outline:none;
}
input:focus{
    border-color:#00d9ff;
    box-shadow: 0 0 10px rgba(0,217,255,.35);
}
input::placeholder{ color:#cbd5e1; }

/* =========================
   BUTTON
========================= */
button{
    width:100%;
    padding:15px;
    margin:9px 0;
    border:none;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{ opacity:.6; cursor:not-allowed; }

.login{ background:#08aeea; color:white; }
.signup{ background:#c026d3; color:white; }
.on{ background:#16c94b; color:white; }
.off{ background:#ff9f0a; color:white; }
.admin{ background: linear-gradient(90deg, #7c3aed, #ec4899); color:white; }
.logout{ background:#64748b; color:white; }
.back{ background:#334155; color:white; }

/* =========================
   STATUS
========================= */
.status{ margin:25px 0; font-size:25px; font-weight:bold; }
.info{ color:#cbd5e1; line-height:1.8; }

/* =========================
   LINKS & MESSAGES
========================= */
.link{ color:#69ddff; cursor:pointer; margin-top:18px; }
.message{ min-height:24px; margin-top:12px; color:#ff7070; font-size:14px; line-height:1.5; }
.success{ color:#4ade80; }

/* =========================
   ADMIN USER LIST
========================= */
.adminBox{
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#142536;
    text-align:left;
    max-height:350px;
    overflow-y:auto;
}
.userRow{ padding:12px 0; border-bottom: 1px solid #334155; }
.userRow:last-child{ border-bottom:none; }
.userName{ font-weight:bold; font-size:16px; }
.userEmail{ color:#94a3b8; font-size:13px; margin-top:4px; }
.userRole{ color:#67e8f9; font-size:13px; margin-top:4px; }

.denyBtn{
    width:auto;
    padding:8px 12px;
    margin-top:8px;
    background:#dc2626;
    color:white;
    font-size:13px;
}
.allowBtn{ background:#16a34a; }

/* =========================
   LOADING & ERROR
========================= */
.loading{ color:#67e8f9; font-size:15px; text-align:center; }
.errorBox{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#3f1515;
    color:#ff9b9b;
    font-size:12px;
    word-break:break-word;
}
</style>
</head>

<body>

<!-- ==================================================
     LOGIN PAGE
================================================== -->
<div id="loginPage" class="container">
    <h1>🔐 Smart Light</h1>
    <div class="subtitle">Secure Access</div>
    
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="login">LOGIN</button>
    
    <div id="loginMessage" class="message"></div>
    <p id="showSignup" class="link">Create new account</p>
</div>

<!-- ==================================================
     SIGNUP PAGE
================================================== -->
<div id="signupPage" class="container hidden">
    <h1>📝 Create Account</h1>
    <div class="subtitle">Register New User</div>
    
    <input type="text" id="signupName" placeholder="Your Name">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    
    <button id="signupBtn" class="signup">CREATE ACCOUNT</button>
    <div id="signupMessage" class="message"></div>
    <p id="showLogin" class="link">Already have an account? Login</p>
</div>

<!-- ==================================================
     CONTROL PAGE
================================================== -->
<div id="controlPage" class="container hidden">
    <h1>💡 Smart Light</h1>
    <div id="welcome" class="subtitle">Welcome</div>
    <div id="lightStatus" class="status">🔴 LIGHT OFF</div>
    
    <button id="onBtn" class="on">💡 TURN ON</button>
    <button id="offBtn" class="off">🔴 TURN OFF</button>
    
    <div class="info">
        Last operation:<br>
        <b id="lastUser">---</b><br>
        Time: <b id="lastTime">---</b>
    </div>
    
    <button id="adminBtn" class="admin hidden">👑 ADMIN PANEL</button>
    <button id="logoutBtn" class="logout">LOGOUT</button>
    
    <div id="controlMessage" class="message"></div>
</div>

<!-- ==================================================
     ADMIN PAGE
================================================== -->
<div id="adminPage" class="container hidden">
    <h1>👑 Admin Panel</h1>
    <div class="subtitle">User Management</div>
    
    <div id="usersList" class="adminBox">
        <div class="loading">Loading users...</div>
    </div>
    
    <button id="backBtn" class="back">← BACK</button>
    <button id="adminLogoutBtn" class="logout">LOGOUT</button>
</div>


<script type="module">
/* ==================================================
   FIREBASE IMPORTS (v10.12.2 - Modular SDK)
================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ==================================================
   FIREBASE CONFIG
================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyA4C0zhOuAGTSbLVVfCaMerVHivLyhEU60",
    authDomain: "smart-light-control-d0b37.firebaseapp.com",
    databaseURL: "https://smart-light-control-d0b37-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "smart-light-control-d0b37",
    storageBucket: "smart-light-control-d0b37.firebasestorage.app",
    messagingSenderId: "318812348687",
    appId: "1:318812348687:web:8fefedd6a16de3eea85e7a",
    measurementId: "G-RHXP0YK5WK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ==================================================
   PAGE VARIABLES & NAVIGATION
================================================== */
const loginPage = document.getElementById("loginPage");
const signupPage = document.getElementById("signupPage");
const controlPage = document.getElementById("controlPage");
const adminPage = document.getElementById("adminPage");

function hideAll() {
    loginPage.classList.add("hidden");
    signupPage.classList.add("hidden");
    controlPage.classList.add("hidden");
    adminPage.classList.add("hidden");
}

function showLogin() { hideAll(); loginPage.classList.remove("hidden"); }
function showSignup() { hideAll(); signupPage.classList.remove("hidden"); }
function showControl() { hideAll(); controlPage.classList.remove("hidden"); }
function showAdmin() { hideAll(); adminPage.classList.remove("hidden"); }

document.getElementById("showSignup").onclick = showSignup;
document.getElementById("showLogin").onclick = showLogin;
document.getElementById("backBtn").onclick = showControl;

/* ==================================================
   ERROR MESSAGES
================================================== */
function getErrorMessage(error) {
    switch(error.code) {
        case "auth/invalid-credential": return "Incorrect email or password.";
        case "auth/user-not-found": return "User account not found.";
        case "auth/wrong-password": return "Incorrect password.";
        case "auth/email-already-in-use": return "Email already exists. Please login.";
        case "auth/weak-password": return "Password must contain at least 6 characters.";
        case "PERMISSION_DENIED": return "Database permission denied. Check your Firebase Rules.";
        default: return error.message || "Unknown Firebase error.";
    }
}

/* ==================================================
   AUTH STATE LISTENER
================================================== */
onAuthStateChanged(auth, async (user) => {
    if (user) {
        await loadUserProfile(user);
    } else {
        showLogin();
    }
});

/* ==================================================
   LOAD USER PROFILE (WITH AUTO-RECOVERY)
================================================== */
async function loadUserProfile(user) {
    try {
        const userRef = ref(db, "users/" + user.uid);
        let snapshot = await get(userRef);

        // If the database profile doesn't exist (e.g. account created manually in Firebase Console)
        if (!snapshot.exists()) {
            try {
                // Auto-create standard profile
                await set(userRef, {
                    name: user.email.split('@')[0], // Use part of email as name
                    email: user.email,
                    role: "user",
                    denied: false
                });
                snapshot = await get(userRef); // Fetch again
            } catch (creationError) {
                throw new Error("Unable to create database profile. Database permissions rejected the write.");
            }
        }

        const data = snapshot.val();

        // Check if user is banned
        if (data.denied === true) {
            await signOut(auth);
            throw new Error("Your account has been denied by the administrator.");
        }

        // Setup Control Page
        document.getElementById("welcome").textContent = "Welcome, " + (data.name || user.email);
        
        // Show Admin panel button if role is admin
        if (String(data.role || "").trim().toLowerCase() === "admin") {
            document.getElementById("adminBtn").classList.remove("hidden");
        } else {
            document.getElementById("adminBtn").classList.add("hidden");
        }

        showControl();
        startLightListener();

    } catch (error) {
        console.error(error);
        document.getElementById("loginMessage").textContent = getErrorMessage(error);
        await signOut(auth);
        showLogin();
    } finally {
        // Always reset buttons so it doesn't freeze
        document.getElementById("loginBtn").disabled = false;
        document.getElementById("loginBtn").textContent = "LOGIN";
        document.getElementById("signupBtn").disabled = false;
        document.getElementById("signupBtn").textContent = "CREATE ACCOUNT";
    }
}

/* ==================================================
   LOGIN
================================================== */
document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginBtn");

    message.textContent = "";
    if (!email || !password) { message.textContent = "Enter email and password."; return; }

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        // Success triggers onAuthStateChanged above
    } catch (error) {
        message.textContent = getErrorMessage(error);
        button.disabled = false;
        button.textContent = "LOGIN";
    }
};

/* ==================================================
   SIGNUP
================================================== */
document.getElementById("signupBtn").onclick = async () => {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("confirmPassword").value;
    const message = document.getElementById("signupMessage");
    const button = document.getElementById("signupBtn");
    
    message.textContent = "";
    if (!name || !email) { message.textContent = "Please fill all fields."; return; }
    if (password.length < 6) { message.textContent = "Password needs 6+ characters."; return; }
    if (password !== confirm) { message.textContent = "Passwords do not match."; return; }

    button.disabled = true;
    button.textContent = "CREATING...";

    try {
        const result = await createUserWithEmailAndPassword(auth, email, password);
        
        await set(ref(db, "users/" + result.user.uid), {
            name: name,
            email: email,
            role: "user",
            denied: false
        });

        message.className = "message success";
        message.textContent = "Account created! Loading...";
    } catch (error) {
        message.className = "message";
        message.textContent = getErrorMessage(error);
        button.disabled = false;
        button.textContent = "CREATE ACCOUNT";
    }
};

/* ==================================================
   LIGHT CONTROLS
================================================== */
let listenerActive = false;

function startLightListener() {
    if (listenerActive) return;
    listenerActive = true;

    onValue(ref(db, "light"), (snapshot) => {
        const data = snapshot.val();
        const statusEl = document.getElementById("lightStatus");
        
        if (!data) {
            statusEl.textContent = "🔴 LIGHT OFF";
            document.getElementById("lastUser").textContent = "---";
            document.getElementById("lastTime").textContent = "---";
            return;
        }

        statusEl.textContent = data.status === "ON" ? "💡 LIGHT ON" : "🔴 LIGHT OFF";
        document.getElementById("lastUser").textContent = data.lastUser || "---";
        document.getElementById("lastTime").textContent = data.lastTime || "---";
    });
}

async function operateLight(action) {
    const user = auth.currentUser;
    if (!user) return;
    
    try {
        const snap = await get(ref(db, "users/" + user.uid));
        if (!snap.exists() || snap.val().denied === true) {
            alert("Your access has been denied.");
            return;
        }
        
        await set(ref(db, "light"), {
            status: action,
            lastUser: snap.val().name || "User",
            lastTime: new Date().toLocaleString()
        });
    } catch (error) {
        console.error(error);
        alert("Failed to operate light. Check permissions.");
    }
}

document.getElementById("onBtn").onclick = () => operateLight("ON");
document.getElementById("offBtn").onclick = () => operateLight("OFF");

/* ==================================================
   ADMIN PANEL
================================================== */
document.getElementById("adminBtn").onclick = () => {
    showAdmin();
    loadUsers();
};

async function loadUsers() {
    const list = document.getElementById("usersList");
    list.innerHTML = `<div class="loading">Loading users...</div>`;
    
    try {
        const snap = await get(ref(db, "users"));
        if (!snap.exists()) {
            list.innerHTML = `<div class="info">No users found.</div>`;
            return;
        }
        
        list.innerHTML = "";
        const users = snap.val();
        
        for (const uid in users) {
            const u = users[uid];
            const div = document.createElement("div");
            div.className = "userRow";
            
            div.innerHTML = `
                <div class="userName">${escapeHTML(u.name || "Unknown")}</div>
                <div class="userEmail">${escapeHTML(u.email || "---")}</div>
                <div class="userRole">Role: ${escapeHTML(u.role || "user")}</div>
            `;
            
            // Allow admin to deny/allow others (but not themselves)
            if (uid !== auth.currentUser.uid) {
                const btn = document.createElement("button");
                btn.className = u.denied ? "denyBtn allowBtn" : "denyBtn";
                btn.textContent = u.denied ? "✅ ALLOW" : "🚫 DENY";
                btn.onclick = () => toggleUser(uid, u.denied);
                div.appendChild(btn);
            }
            list.appendChild(div);
        }
    } catch (error) {
        console.error(error);
        list.innerHTML = `<div class="errorBox">Failed to load users. Ensure you are an Admin.</div>`;
    }
}

async function toggleUser(uid, currentlyDenied) {
    try {
        await update(ref(db, "users/" + uid), { denied: !currentlyDenied });
        loadUsers(); 
    } catch (error) {
        console.error(error);
        alert("Permission error. Failed to update user.");
    }
}

/* ==================================================
   LOGOUT & SECURITY
================================================== */
const doLogout = () => signOut(auth);
document.getElementById("logoutBtn").onclick = doLogout;
document.getElementById("adminLogoutBtn").onclick = doLogout;

function escapeHTML(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
