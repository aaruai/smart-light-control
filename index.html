<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Light Control</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #061326,
        #073b4c,
        #071d4d
    );

    color:white;
}


/* =========================
   CONTAINER
========================= */

.container{

    width:92%;
    max-width:430px;

    padding:30px;

    background:
    rgba(8,35,48,0.96);

    border-radius:22px;

    box-shadow:
    0 15px 50px rgba(0,0,0,.55);

    text-align:center;
}


.hidden{
    display:none !important;
}


/* =========================
   HEADINGS
========================= */

h1{

    margin:0 0 8px;

    font-size:30px;

}


.subtitle{

    color:#b7dce5;

    margin-bottom:25px;

}


/* =========================
   INPUT
========================= */

input{

    width:100%;

    padding:15px;

    margin:8px 0;

    border-radius:10px;

    border:1px solid #607d8b;

    background:#263b46;

    color:white;

    font-size:16px;

    outline:none;

}


input:focus{

    border-color:#00d9ff;

    box-shadow:
    0 0 10px
    rgba(0,217,255,.35);

}


input::placeholder{

    color:#cbd5e1;

}


/* =========================
   BUTTON
========================= */

button{

    width:100%;

    padding:15px;

    margin:9px 0;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.login{

    background:#08aeea;

    color:white;

}


.signup{

    background:#c026d3;

    color:white;

}


.on{

    background:#16c94b;

    color:white;

}


.off{

    background:#ff9f0a;

    color:white;

}


.admin{

    background:
    linear-gradient(
        90deg,
        #7c3aed,
        #ec4899
    );

    color:white;

}


.logout{

    background:#64748b;

    color:white;

}


.back{

    background:#334155;

    color:white;

}


/* =========================
   STATUS
========================= */

.status{

    margin:25px 0;

    font-size:25px;

    font-weight:bold;

}


.info{

    color:#cbd5e1;

    line-height:1.8;

}


/* =========================
   LINKS
========================= */

.link{

    color:#69ddff;

    cursor:pointer;

    margin-top:18px;

}


/* =========================
   MESSAGES
========================= */

.message{

    min-height:24px;

    margin-top:12px;

    color:#ff7070;

    font-size:14px;

    line-height:1.5;

}


.success{

    color:#4ade80;

}


/* =========================
   ADMIN USER LIST
========================= */

.adminBox{

    margin-top:15px;

    padding:15px;

    border-radius:12px;

    background:#142536;

    text-align:left;

    max-height:350px;

    overflow-y:auto;

}


.userRow{

    padding:12px 0;

    border-bottom:
    1px solid #334155;

}


.userRow:last-child{

    border-bottom:none;

}


.userName{

    font-weight:bold;

    font-size:16px;

}


.userEmail{

    color:#94a3b8;

    font-size:13px;

    margin-top:4px;

}


.userRole{

    color:#67e8f9;

    font-size:13px;

    margin-top:4px;

}


.denyBtn{

    width:auto;

    padding:8px 12px;

    margin-top:8px;

    background:#dc2626;

    color:white;

    font-size:13px;

}


.allowBtn{

    background:#16a34a;

}


/* =========================
   LOADING
========================= */

.loading{

    color:#67e8f9;

    font-size:15px;

}


/* =========================
   ERROR BOX
========================= */

.errorBox{

    margin-top:15px;

    padding:10px;

    border-radius:8px;

    background:#3f1515;

    color:#ff9b9b;

    font-size:12px;

    word-break:break-word;

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN PAGE
================================================== -->

<div
    id="loginPage"
    class="container">

    <h1>🔐 Smart Light</h1>

    <div class="subtitle">
        Secure Access
    </div>


    <input
        type="email"
        id="loginEmail"
        placeholder="Email"
        autocomplete="email">


    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password">


    <button
        id="loginBtn"
        class="login">

        LOGIN

    </button>


    <div
        id="loginMessage"
        class="message">
    </div>


    <p
        id="showSignup"
        class="link">

        Create new account

    </p>

</div>



<!-- ==================================================
     SIGNUP PAGE
================================================== -->

<div
    id="signupPage"
    class="container hidden">

    <h1>📝 Create Account</h1>

    <div class="subtitle">
        Register New User
    </div>


    <input
        type="text"
        id="signupName"
        placeholder="Your Name">


    <input
        type="email"
        id="signupEmail"
        placeholder="Email">


    <input
        type="password"
        id="signupPassword"
        placeholder="Password">


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password">


    <button
        id="signupBtn"
        class="signup">

        CREATE ACCOUNT

    </button>


    <div
        id="signupMessage"
        class="message">
    </div>


    <p
        id="showLogin"
        class="link">

        Already have an account? Login

    </p>

</div>



<!-- ==================================================
     CONTROL PAGE
================================================== -->

<div
    id="controlPage"
    class="container hidden">

    <h1>💡 Smart Light</h1>


    <div
        id="welcome"
        class="subtitle">

        Welcome

    </div>


    <div
        id="lightStatus"
        class="status">

        🔴 LIGHT OFF

    </div>


    <button
        id="onBtn"
        class="on">

        💡 TURN ON

    </button>


    <button
        id="offBtn"
        class="off">

        🔴 TURN OFF

    </button>


    <div class="info">

        Last operation:

        <br>

        <b id="lastUser">
            ---
        </b>

        <br>

        Time:

        <b id="lastTime">
            ---
        </b>

    </div>


    <!-- ADMIN BUTTON -->

    <button
        id="adminBtn"
        class="admin hidden">

        👑 ADMIN PANEL

    </button>


    <button
        id="logoutBtn"
        class="logout">

        LOGOUT

    </button>


    <div
        id="controlMessage"
        class="message">
    </div>

</div>



<!-- ==================================================
     ADMIN PAGE
================================================== -->

<div
    id="adminPage"
    class="container hidden">

    <h1>👑 Admin Panel</h1>

    <div class="subtitle">

        User Management

    </div>


    <div
        id="usersList"
        class="adminBox">

        <div class="loading">
            Loading users...
        </div>

    </div>


    <button
        id="backBtn"
        class="back">

        ← BACK

    </button>


    <button
        id="adminLogoutBtn"
        class="logout">

        LOGOUT

    </button>

</div>



<script type="module">


/* ==================================================
   FIREBASE IMPORTS
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    get,
    set,
    update,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyA4C0zhOuAGTSbLVVfCaMerVHivLyhEU60",

    authDomain:
    "smart-light-control-d0b37.firebaseapp.com",

    databaseURL:
    "https://smart-light-control-d0b37-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "smart-light-control-d0b37",

    storageBucket:
    "smart-light-control-d0b37.firebasestorage.app",

    messagingSenderId:
    "318812348687",

    appId:
    "1:318812348687:web:8fefedd6a16de3eea85e7a",

    measurementId:
    "G-RHXP0YK5WK"

};



/* ==================================================
   FIREBASE INITIALIZATION
================================================== */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getDatabase(app);



/* ==================================================
   PAGE VARIABLES
================================================== */

const loginPage =
document.getElementById("loginPage");

const signupPage =
document.getElementById("signupPage");

const controlPage =
document.getElementById("controlPage");

const adminPage =
document.getElementById("adminPage");



/* ==================================================
   PAGE FUNCTIONS
================================================== */

function showLogin(){

    loginPage.classList.remove("hidden");

    signupPage.classList.add("hidden");

    controlPage.classList.add("hidden");

    adminPage.classList.add("hidden");

}


function showSignup(){

    loginPage.classList.add("hidden");

    signupPage.classList.remove("hidden");

    controlPage.classList.add("hidden");

    adminPage.classList.add("hidden");

}


function showControl(){

    loginPage.classList.add("hidden");

    signupPage.classList.add("hidden");

    controlPage.classList.remove("hidden");

    adminPage.classList.add("hidden");

}


function showAdmin(){

    loginPage.classList.add("hidden");

    signupPage.classList.add("hidden");

    controlPage.classList.add("hidden");

    adminPage.classList.remove("hidden");

}



/* ==================================================
   FIREBASE ERROR MESSAGE
================================================== */

function getErrorMessage(error){

    console.error(error);

    switch(error.code){

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/invalid-email":
            return "Invalid email address.";

        case "auth/user-not-found":
            return "User account not found.";

        case "auth/wrong-password":
            return "Incorrect password.";

        case "auth/email-already-in-use":
            return "Email already exists. Please login.";

        case "auth/weak-password":
            return "Password must contain at least 6 characters.";

        case "auth/network-request-failed":
            return "Network error. Check your internet.";

        case "PERMISSION_DENIED":
            return "Firebase Database permission denied.";

        default:
            return error.message ||
                   "Unknown Firebase error.";

    }

}



/* ==================================================
   SHOW SIGNUP
================================================== */

document
.getElementById("showSignup")
.onclick = function(){

    showSignup();

};



/* ==================================================
   SHOW LOGIN
================================================== */

document
.getElementById("showLogin")
.onclick = function(){

    showLogin();

};



/* ==================================================
   LOGIN
================================================== */

document
.getElementById("loginBtn")
.onclick = async function(){

    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("loginPassword")
    .value;


    const message =
    document
    .getElementById("loginMessage");


    message.textContent = "";


    if(email === ""){

        message.textContent =
        "Please enter your email.";

        return;

    }


    if(password === ""){

        message.textContent =
        "Please enter your password.";

        return;

    }


    const button =
    document.getElementById("loginBtn");


    button.disabled = true;

    button.textContent =
    "LOGGING IN...";


    try{

        /*
          Firebase Authentication
        */

        const result =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        /*
          Directly load the user's database
          profile after successful login.
        */

        await loadUserProfile(
            result.user
        );


    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        message.textContent =
        getErrorMessage(error);


        button.disabled = false;

        button.textContent =
        "LOGIN";

    }

};



/* ==================================================
   LOAD USER PROFILE
================================================== */

async function loadUserProfile(user){

    if(!user){

        showLogin();

        return;

    }


    try{

        const userRef =
        ref(
            db,
            "users/" + user.uid
        );


        const snapshot =
        await get(userRef);


        /*
          IMPORTANT:
          Authentication succeeded but database
          profile does not exist.
        */

        if(!snapshot.exists()){

            throw new Error(
                "Authentication succeeded, but no user profile exists at /users/" +
                user.uid
            );

        }


        const data =
        snapshot.val();


        console.log(
            "USER PROFILE:",
            data
        );


        /* DENIED USER */

        if(data.denied === true){

            await signOut(auth);

            throw new Error(
                "Your account has been denied by the administrator."
            );

        }


        /* SHOW CONTROL PAGE */

        showControl();


        document
        .getElementById("welcome")
        .textContent =
        "Welcome, " +
        (data.name || user.email);


        /*
          ADMIN CHECK
        */

        const role =
        String(data.role || "")
        .trim()
        .toLowerCase();


        const adminButton =
        document.getElementById("adminBtn");


        if(role === "admin"){

            adminButton.classList.remove(
                "hidden"
            );

            console.log(
                "ADMIN LOGIN CONFIRMED"
            );

        }

        else{

            adminButton.classList.add(
                "hidden"
            );

        }


        startLightListener();

    }

    catch(error){

        console.error(
            "PROFILE ERROR:",
            error
        );


        document
        .getElementById("loginMessage")
        .textContent =
        getErrorMessage(error);


        /*
          If profile cannot be loaded,
          sign out to avoid a broken state.
        */

        await signOut(auth);

        showLogin();

    }

}



/* ==================================================
   AUTH STATE
================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "AUTH STATE:",
            user
        );


        /*
          If already logged in when page
          opens, restore the session.
        */

        if(user){

            /*
              Only load if currently on login/signup.
            */

            if(
                !controlPage.classList.contains(
                    "hidden"
                )
                &&
                !adminPage.classList.contains(
                    "hidden"
                )
            ){

                return;

            }


            try{

                await loadUserProfile(user);

            }

            catch(error){

                console.error(error);

            }

        }

        else{

            showLogin();

        }

    }
);



/* ==================================================
   SIGNUP
================================================== */

document
.getElementById("signupBtn")
.onclick = async function(){

    const name =
    document
    .getElementById("signupName")
    .value
    .trim();


    const email =
    document
    .getElementById("signupEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("signupPassword")
    .value;


    const confirm =
    document
    .getElementById("confirmPassword")
    .value;


    const message =
    document
    .getElementById("signupMessage");


    message.textContent = "";


    if(name === ""){

        message.textContent =
        "Please enter your name.";

        return;

    }


    if(email === ""){

        message.textContent =
        "Please enter your email.";

        return;

    }


    if(password.length < 6){

        message.textContent =
        "Password must contain at least 6 characters.";

        return;

    }


    if(password !== confirm){

        message.textContent =
        "Passwords do not match.";

        return;

    }


    const button =
    document.getElementById("signupBtn");


    button.disabled = true;

    button.textContent =
    "CREATING...";


    try{

        /*
          Create Firebase Authentication account.
        */

        const result =
        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


        /*
          IMPORTANT:
          Write the database profile BEFORE
          loading the control page.
        */

        await set(

            ref(
                db,
                "users/" + result.user.uid
            ),

            {

                name: name,

                email: email,

                role: "user",

                denied: false

            }

        );


        message.className =
        "message success";


        message.textContent =
        "Account created successfully. Loading...";


        /*
          Now profile definitely exists.
        */

        await loadUserProfile(
            result.user
        );

    }

    catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        message.className =
        "message";


        message.textContent =
        getErrorMessage(error);

    }


    button.disabled = false;

    button.textContent =
    "CREATE ACCOUNT";

};



/* ==================================================
   LIGHT LISTENER
================================================== */

let lightListenerStarted = false;


function startLightListener(){

    if(lightListenerStarted){

        return;

    }


    lightListenerStarted = true;


    const lightRef =
    ref(db,"light");


    onValue(

        lightRef,

        function(snapshot){

            const data =
            snapshot.val();


            if(!data){

                document
                .getElementById("lightStatus")
                .textContent =
                "🔴 LIGHT OFF";

                document
                .getElementById("lastUser")
                .textContent =
                "---";

                document
                .getElementById("lastTime")
                .textContent =
                "---";

                return;

            }


            if(data.status === "ON"){

                document
                .getElementById("lightStatus")
                .textContent =
                "💡 LIGHT ON";

            }
