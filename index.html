<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Light Control</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
      padding: 30px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
    }

    button {
      width: 80%;
      padding: 15px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .on {
      background: #22c55e;
      color: white;
    }

    .off {
      background: #ef4444;
      color: white;
    }

    #status {
      font-size: 25px;
      margin: 20px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>💡 Smart Light Control</h1>

  <p id="user">User: Arun</p>

  <div id="status">Status: OFF</div>

  <button class="on" onclick="turnOn()">TURN ON</button>
  <button class="off" onclick="turnOff()">TURN OFF</button>

  <p id="time">Last Time: --</p>
</div>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4C0zhOuAGTSbLVVfCaMerVHiVLyhEU60",
  authDomain: "smart-light-control-d0b37.firebaseapp.com",
  databaseURL: "https://smart-light-control-d0b37-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "smart-light-control-d0b37",
  storageBucket: "smart-light-control-d0b37.firebasestorage.app",
  messagingSenderId: "318812348687",
  appId: "1:318812348687:web:8fefedd6a16de3eea85e7a"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

window.turnOn = function() {
  set(ref(database, "light"), {
    status: "ON",
    lastUser: "Arun",
    lastTime: new Date().toLocaleString()
  });
};

window.turnOff = function() {
  set(ref(database, "light"), {
    status: "OFF",
    lastUser: "Arun",
    lastTime: new Date().toLocaleString()
  });
};

onValue(ref(database, "light"), (snapshot) => {

  const data = snapshot.val();

  if (data) {
    document.getElementById("status").innerText =
      "Status: " + data.status;

    document.getElementById("user").innerText =
      "Last User: " + (data.lastUser || "None");

    document.getElementById("time").innerText =
      "Last Time: " + (data.lastTime || "--");
  }

});

</script>

</body>
</html>
